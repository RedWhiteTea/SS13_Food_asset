<!DOCTYPE html>
<html lang="zh-CN" style="overflow:hidden;height:100%">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SS13 速查手册 - 医疗</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
@keyframes dumiSlideUp{from{bottom:-58px}to{bottom:-8px}}
.achievement-card{
  position:fixed;left:50%;bottom:20%;transform:translateX(-50%);
  width:80%;max-width:480px;height:130px;
  background:#424242;border:4px solid #fff;
  border-radius:8px;
  box-shadow:0 0 0 4px #424242,0 0 0 8px #fff,0 0 0 12px #424242;
  display:flex;align-items:center;justify-content:center;
  z-index:2000;transition:opacity 2s ease;
}
.achievement-card span{
  color:#ffd700;font-size:16px;font-weight:700;
  text-align:center;line-height:1.4;padding:10px;
}
</style>
</head>
<body style="position:relative;overflow-y:auto;height:100%;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch">

<nav class="top-nav">
  <div class="nav-logo"><span>医疗MED</span></div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="location.href='../index.html'" title="返回"><img src="../Icons/Misc/Return_btn.PNG" alt="返回" class="nav-btn-icon"></button>
  </div>
</nav>

<div class="main-buttons">
  <button class="main-btn main-btn-med-red" onclick="location.href='Medicine.html'"><span>药品搜索</span></button>
<button class="main-btn main-btn-med-lblue" onclick="location.href='treatment.html'"><span>治疗方式搜索</span></button>
  <button class="main-btn main-btn-med-purple"><span>制药</span></button>
  <button class="main-btn main-btn-med-green"><span>手术</span></button>
</div>

<div id="anchorCorner" style="position:absolute;left:0;bottom:-5px;width:45px;height:45px;background:transparent;cursor:pointer;" onclick="handleClick()"></div>

<script>
var clickCount = 0;
var dumiTotalClicks = 0;

function showAchievement(text) {
  var oldC = document.getElementById('achievementCard');
  if (oldC) oldC.remove();
  var card = document.createElement('div');
  card.id = 'achievementCard';
  card.className = 'achievement-card';
  card.innerHTML = '<span>达成成就<br>' + text + '</span>';
  document.body.appendChild(card);
  setTimeout(function() { card.style.opacity = '0'; }, 3000);
  setTimeout(function() { if (card.parentNode) card.remove(); }, 5000);
}

function handleClick() {
  clickCount++;
  if (clickCount === 2) {
    if (document.getElementById('dumiImg')) return;
    var img = document.createElement('img');
    img.id = 'dumiImg';
    img.src = '../Icons/Misc/Dumi_f.png';
    img.style.cssText = 'position:absolute;left:0;bottom:-58px;max-height:64px;cursor:pointer;z-index:999;animation:dumiSlideUp 1.5s ease-out forwards;';
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      var old = document.getElementById('dumiText');
      if (old) { old.remove(); }
      var txt = document.createElement('div');
      txt.id = 'dumiText';
      txt.style.cssText = 'position:absolute;left:70px;bottom:8px;font-size:12px;font-weight:700;color:var(--ink);background:var(--bg2);border:3px solid var(--ink);padding:4px 10px;border-radius:0;box-shadow:3px 3px 0 rgba(0,0,0,.15);z-index:1000;white-space:nowrap;transition:opacity 2s ease;';
      txt.textContent = '你摸了摸 dumi 的头';
      document.body.appendChild(txt);
      setTimeout(function() { txt.style.opacity = '0'; }, 50);
      setTimeout(function() { if (txt.parentNode) txt.remove(); }, 2100);
      dumiTotalClicks++;
      if (dumiTotalClicks === 50) {
        showAchievement('嘿，你真的很喜欢dumi');
      }
      if (dumiTotalClicks === 100) {
        showAchievement('痴迷dumi');
        dumiTotalClicks = 0;
      }
    });
    document.body.appendChild(img);
  }
}
</script>
</body>
</html>
